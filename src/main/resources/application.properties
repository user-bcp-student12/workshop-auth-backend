quarkus.http.port=8080
quarkus.http.host=127.0.0.1
%prod.quarkus.http.host=0.0.0.0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.jackson.fail-on-unknown-properties=false
%dev.auth.token.secret=${AUTH_TOKEN_SECRET:workshop-auth-dev-only-secret-32-bytes}
%test.auth.token.secret=${AUTH_TOKEN_SECRET:workshop-auth-test-only-secret-32-bytes}
%prod.auth.token.secret=${AUTH_TOKEN_SECRET}
%dev.auth.token.allowed-clients=${AUTH_TOKEN_ALLOWED_CLIENTS:angular-workshop}
%test.auth.token.allowed-clients=${AUTH_TOKEN_ALLOWED_CLIENTS:angular-workshop}
%prod.auth.token.allowed-clients=${AUTH_TOKEN_ALLOWED_CLIENTS}
